name: Apps Script AI Live Smoke

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider to smoke test"
        required: true
        default: openai
        type: choice
        options:
          - openai
          - gemini
          - vertex_gemini
          - openrouter
          - perplexity
      prompt:
        description: "Prompt to send"
        required: true
        default: "Reply with OK"
        type: string
      model:
        description: "Optional model override"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  live-ai-smoke:
    runs-on: ubuntu-latest
    env:
      GAS_TEST_SCRIPT_ID: ${{ vars.GAS_TEST_SCRIPT_ID }}
      GAS_PRODUCTION_SCRIPT_ID: ${{ vars.GAS_SCRIPT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node and dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '20'

      - name: Setup clasp CLI and binding
        uses: ./.github/actions/setup-clasp
        with:
          script-id: ${{ env.GAS_TEST_SCRIPT_ID }}
          root-dir: apps_script_tools

      - name: Configure clasp auth
        uses: ./.github/actions/configure-clasp-auth
        with:
          clasp-client-id: ${{ secrets.CLASP_CLIENT_ID }}
          clasp-client-secret: ${{ secrets.CLASP_CLIENT_SECRET }}
          clasp-refresh-token: ${{ secrets.CLASP_REFRESH_TOKEN }}

      - name: Verify production clasp push set
        run: npm run check:clasp:production

      - name: Push and execute live AI smoke
        env:
          INPUT_PROVIDER: ${{ inputs.provider }}
          INPUT_PROMPT: ${{ inputs.prompt }}
          INPUT_MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          clasp status
          npm run clasp:test-push
          AI_PARAMS="$(node -e "process.stdout.write(JSON.stringify([process.env.INPUT_PROVIDER || '', process.env.INPUT_PROMPT || '', process.env.INPUT_MODEL || '']))")"
          clasp run runAiLiveSmoke --params "$AI_PARAMS"
