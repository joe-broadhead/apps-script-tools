name: Apps Script Integration

on:
  workflow_call:
    inputs:
      suite:
        description: "Integration suite to run"
        required: false
        default: functional
        type: string
    secrets:
      CLASP_CLIENT_ID:
        required: true
      CLASP_CLIENT_SECRET:
        required: true
      CLASP_REFRESH_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      suite:
        description: "Integration suite to run"
        required: true
        default: functional
        type: choice
        options:
          - functional
          - perf

permissions:
  contents: read

jobs:
  gas-tests:
    runs-on: ubuntu-latest
    env:
      GAS_TEST_SCRIPT_ID: ${{ vars.GAS_TEST_SCRIPT_ID }}
      GAS_PRODUCTION_SCRIPT_ID: ${{ vars.GAS_SCRIPT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node and dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '20'

      - name: Setup clasp CLI and binding
        uses: ./.github/actions/setup-clasp
        with:
          script-id: ${{ env.GAS_TEST_SCRIPT_ID }}
          root-dir: apps_script_tools

      - name: Configure clasp auth
        uses: ./.github/actions/configure-clasp-auth
        with:
          clasp-client-id: ${{ secrets.CLASP_CLIENT_ID }}
          clasp-client-secret: ${{ secrets.CLASP_CLIENT_SECRET }}
          clasp-refresh-token: ${{ secrets.CLASP_REFRESH_TOKEN }}

      - name: Verify production clasp push set
        run: npm run check:clasp:production

      - name: Push and execute integration tests
        env:
          INPUT_SUITE: ${{ inputs.suite }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          LOG_FILE="artifacts/gas-integration-${INPUT_SUITE}.log"
          exec > >(tee "${LOG_FILE}") 2>&1

          clasp status
          npm run clasp:test-push
          run_and_verify_clasp() {
            local function_name="$1"
            local output
            set +e
            output="$(clasp run "${function_name}" 2>&1)"
            local run_status=$?
            set -e
            printf '%s\n' "${output}"
            if [ "${run_status}" -ne 0 ]; then
              exit "${run_status}"
            fi
            if printf '%s\n' "${output}" | grep -Eiq 'Script function not found|Unable to run script function|Please make sure|Exception|Error:'; then
              echo "clasp run ${function_name} reported an execution error."
              exit 1
            fi
            if [ "${function_name}" = "runAllTests" ] && ! printf '%s\n' "${output}" | grep -Eq '[0-9]+/[0-9]+ tests passed|\"failed\"[[:space:]]*:[[:space:]]*0'; then
              echo "clasp run runAllTests did not report a successful test summary."
              exit 1
            fi
            if [ "${function_name}" = "runPerformanceBenchmarks" ] && ! printf '%s\n' "${output}" | grep -Eq 'suiteMs|fromRecords|operations'; then
              echo "clasp run runPerformanceBenchmarks did not report benchmark output."
              exit 1
            fi
          }
          if [ "${INPUT_SUITE}" = "perf" ]; then
            run_and_verify_clasp runPerformanceBenchmarks
          else
            run_and_verify_clasp runAllTests
          fi

      - name: Upload GAS integration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gas-integration-${{ inputs.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/gas-integration-*.log
          if-no-files-found: warn
          retention-days: 14
