name: GitHub API Live Smoke

on:
  workflow_dispatch:
    inputs:
      owner:
        description: "Optional owner for repository smoke"
        required: false
        default: ""
        type: string
      repo:
        description: "Optional repo for repository smoke"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  live-github-smoke:
    runs-on: ubuntu-latest
    env:
      SCRIPT_ID: ${{ vars.GAS_SCRIPT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node and dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '20'

      - name: Setup clasp CLI and binding
        uses: ./.github/actions/setup-clasp
        with:
          script-id: ${{ env.SCRIPT_ID }}
          root-dir: apps_script_tools

      - name: Configure clasp auth
        uses: ./.github/actions/configure-clasp-auth
        with:
          clasp-client-id: ${{ secrets.CLASP_CLIENT_ID }}
          clasp-client-secret: ${{ secrets.CLASP_CLIENT_SECRET }}
          clasp-refresh-token: ${{ secrets.CLASP_REFRESH_TOKEN }}

      - name: Push Apps Script project
        run: |
          set -euo pipefail
          clasp status
          clasp push

      - name: Seed GitHub live-smoke token
        env:
          LIVE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          GITHUB_TOKEN_PARAMS="$(node -e "process.stdout.write(JSON.stringify([process.env.LIVE_GITHUB_TOKEN || '']))")"
          clasp run seedGitHubLiveSmokeToken --params "$GITHUB_TOKEN_PARAMS"

      - name: Execute GitHub live smoke
        env:
          INPUT_OWNER: ${{ inputs.owner }}
          INPUT_REPO: ${{ inputs.repo }}
        run: |
          set -euo pipefail
          GITHUB_PARAMS="$(node -e "process.stdout.write(JSON.stringify([process.env.INPUT_OWNER || '', process.env.INPUT_REPO || '']))")"
          clasp run runGitHubLiveSmokeForRepo --params "$GITHUB_PARAMS"
