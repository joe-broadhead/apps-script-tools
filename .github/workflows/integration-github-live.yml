name: GitHub API Live Smoke

on:
  workflow_dispatch:
    inputs:
      owner:
        description: "Optional owner for repository smoke"
        required: false
        default: ""
        type: string
      repo:
        description: "Optional repo for repository smoke"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  live-github-smoke:
    runs-on: ubuntu-latest
    env:
      GAS_TEST_SCRIPT_ID: ${{ vars.GAS_TEST_SCRIPT_ID }}
      GAS_PRODUCTION_SCRIPT_ID: ${{ vars.GAS_SCRIPT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node and dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '20'

      - name: Setup clasp CLI and binding
        uses: ./.github/actions/setup-clasp
        with:
          script-id: ${{ env.GAS_TEST_SCRIPT_ID }}
          root-dir: apps_script_tools

      - name: Configure clasp auth
        uses: ./.github/actions/configure-clasp-auth
        with:
          clasp-client-id: ${{ secrets.CLASP_CLIENT_ID }}
          clasp-client-secret: ${{ secrets.CLASP_CLIENT_SECRET }}
          clasp-refresh-token: ${{ secrets.CLASP_REFRESH_TOKEN }}

      - name: Verify production clasp push set
        run: npm run check:clasp:production

      - name: Push Apps Script project
        run: |
          set -euo pipefail
          clasp status
          npm run clasp:test-push

      - name: Execute GitHub live smoke
        env:
          LIVE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_OWNER: ${{ inputs.owner }}
          INPUT_REPO: ${{ inputs.repo }}
        run: |
          set -euo pipefail
          GITHUB_PARAMS="$(node -e "process.stdout.write(JSON.stringify([process.env.LIVE_GITHUB_TOKEN || '', process.env.INPUT_OWNER || '', process.env.INPUT_REPO || '']))")"
          clasp run runGitHubLiveSmoke --params "$GITHUB_PARAMS"

      - name: Clean up GitHub live-smoke token
        if: always()
        run: |
          set -euo pipefail
          if ! command -v clasp >/dev/null 2>&1; then
            echo "::warning::Skipping GitHub live-smoke cleanup because clasp is not installed."
            exit 0
          fi
          if [ ! -f .clasp.json ]; then
            echo "::warning::Skipping GitHub live-smoke cleanup because .clasp.json is unavailable."
            exit 0
          fi
          clasp run cleanupGitHubLiveSmokeToken
