name: Setup Node and install dependencies
description: Configure Node.js and install project dependencies from the committed npm lockfile.

inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: '20'
  install-deps:
    description: Whether to install dependencies after Node setup.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install Node dependencies
      if: ${{ inputs.install-deps == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        if [ ! -f package-lock.json ] && [ ! -f npm-shrinkwrap.json ]; then
          echo "Missing npm lockfile. Commit package-lock.json or npm-shrinkwrap.json before CI can install dependencies deterministically."
          exit 1
        fi
        npm ci --ignore-scripts
