name: Setup clasp CLI and binding
description: Install clasp and bind a target Apps Script project without OAuth credentials.

inputs:
  script-id:
    description: Apps Script project ID.
    required: true
  root-dir:
    description: Project rootDir for .clasp.json.
    required: false
    default: apps_script_tools
  clasp-version:
    description: Pinned @google/clasp version. Bump intentionally during dependency maintenance.
    required: false
    default: 2.4.2

runs:
  using: composite
  steps:
    - name: Install clasp
      shell: bash
      env:
        CLASP_VERSION: ${{ inputs.clasp-version }}
      run: |
        set -euo pipefail
        npm install -g "@google/clasp@${CLASP_VERSION}" --ignore-scripts --no-audit --no-fund

    - name: Configure script binding
      shell: bash
      run: |
        set -euo pipefail
        if [ -z "${{ inputs.script-id }}" ]; then
          echo "Missing script-id input. Configure repository variable GAS_SCRIPT_ID."
          exit 1
        fi
        cat > .clasp.json <<JSON
        {
          "scriptId": "${{ inputs.script-id }}",
          "rootDir": "${{ inputs.root-dir }}"
        }
        JSON
